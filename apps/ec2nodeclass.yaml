apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: duel-dev-karpenter-node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: duel-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: duel-dev
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 1