apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  annotations:
    # Create the Secret before the Deployment needs it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: secretsmanager
  target:
    name: {{ .Release.Name }}
  data:
    - secretKey: DUEL_SEAT_SECRET
      remoteRef:
        key: {{ .Values.seatSecret.key }}